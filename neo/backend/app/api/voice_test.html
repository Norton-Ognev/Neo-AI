<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neo — проверка микрофона</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { max-width: 760px; margin: 3rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .4rem; }
    p { line-height: 1.5; }
    button { padding: .75rem 1rem; margin: .5rem .5rem .5rem 0; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    label { display: block; margin: .8rem 0; }
    #status { min-height: 1.5rem; font-weight: 600; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; border-radius: .5rem; background: #222; color: #eee; }
  </style>
</head>
<body>
  <h1>Проверка голосового ввода Neo</h1>
  <p>Нажмите «Начать запись», разрешите доступ к микрофону и произнесите команду. Нажмите «Остановить и отправить».</p>
  <label>Микрофон: <select id="microphone"><option value="">По умолчанию в Windows</option></select>
    <button id="refresh" type="button">Обновить список</button>
  </label>
  <button id="start">Начать запись</button>
  <button id="stop" disabled>Остановить и отправить</button>
  <label><input id="speak" type="checkbox" checked> Произнести ответ вслух</label>
  <div id="status" role="status" aria-live="polite">Готово к записи.</div>
  <h2>Распознанная команда и ответ</h2>
  <pre id="result">Пока нет запроса.</pre>
  <script>
    const startButton = document.querySelector('#start');
    const stopButton = document.querySelector('#stop');
    const microphoneSelect = document.querySelector('#microphone');
    const refreshButton = document.querySelector('#refresh');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    let recorder;
    let stream;
    let chunks = [];

    async function refreshMicrophones() {
      let permissionStream;
      try {
        permissionStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const selected = microphoneSelect.value;
        const inputs = (await navigator.mediaDevices.enumerateDevices())
          .filter(device => device.kind === 'audioinput');
        microphoneSelect.replaceChildren(new Option('По умолчанию в Windows', ''));
        inputs.forEach((device, index) => {
          microphoneSelect.add(new Option(device.label || `Микрофон ${index + 1}`, device.deviceId));
        });
        if (inputs.some(device => device.deviceId === selected)) microphoneSelect.value = selected;
        status.textContent = 'Список микрофонов обновлён. Выберите устройство и начните запись.';
      } catch (error) {
        status.textContent = `Не удалось получить список микрофонов: ${error.message}`;
      } finally {
        permissionStream?.getTracks().forEach(track => track.stop());
      }
    }
    refreshButton.addEventListener('click', refreshMicrophones);

    function chooseMimeType() {
      const options = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
      return options.find(type => MediaRecorder.isTypeSupported(type)) || '';
    }

    startButton.addEventListener('click', async () => {
      try {
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
          throw new Error('Браузер не поддерживает запись микрофона. Откройте страницу в актуальном Chrome или Edge.');
        }
        const selectedDevice = microphoneSelect.value;
        const audioConstraints = {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        };
        if (selectedDevice) audioConstraints.deviceId = { exact: selectedDevice };
        stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
        const selected = microphoneSelect.value;
        const inputs = (await navigator.mediaDevices.enumerateDevices())
          .filter(device => device.kind === 'audioinput');
        microphoneSelect.replaceChildren(new Option('По умолчанию в Windows', ''));
        inputs.forEach((device, index) => {
          microphoneSelect.add(new Option(device.label || `Микрофон ${index + 1}`, device.deviceId));
        });
        if (selected && inputs.some(device => device.deviceId === selected)) microphoneSelect.value = selected;
        const mimeType = chooseMimeType();
        recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
        chunks = [];
        recorder.addEventListener('dataavailable', event => {
          if (event.data.size) chunks.push(event.data);
        });
        recorder.addEventListener('stop', sendRecording, { once: true });
        recorder.start();
        startButton.disabled = true;
        stopButton.disabled = false;
        status.textContent = 'Идёт запись… Говорите после сигнала браузера.';
        result.textContent = '';
      } catch (error) {
        status.textContent = `Не удалось начать запись: ${error.message}`;
        stream?.getTracks().forEach(track => track.stop());
      }
    });

    stopButton.addEventListener('click', () => {
      if (recorder?.state === 'recording') {
        status.textContent = 'Запись остановлена, отправляю аудио на распознавание…';
        stopButton.disabled = true;
        recorder.stop();
        stream?.getTracks().forEach(track => track.stop());
      }
    });

    async function sendRecording() {
      startButton.disabled = false;
      try {
        const type = recorder.mimeType || 'audio/webm';
        const extension = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
        const audio = new Blob(chunks, { type });
        if (!audio.size) throw new Error('Браузер не записал аудио. Проверьте микрофон и попробуйте снова.');
        const form = new FormData();
        form.append('audio', audio, `voice-command.${extension}`);
        form.append('session_id', 'mic-test');
        form.append('speak', String(document.querySelector('#speak').checked));

        const response = await fetch('/api/voice/command', { method: 'POST', body: form });
        const body = await response.json();
        result.textContent = JSON.stringify(body, null, 2);
        status.textContent = response.ok ? 'Готово.' : `Сервер вернул ошибку ${response.status}.`;
      } catch (error) {
        status.textContent = `Не удалось отправить аудио: ${error.message}`;
      }
    }
  </script>
</body>
</html>
